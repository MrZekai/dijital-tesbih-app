name: Android QA APK

on:
  workflow_dispatch:
  push:
    branches:
      - global-v1.1.0
    paths:
      - "frontend/**"
      - ".github/workflows/android-qa-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-qa-apk:
    name: Build standalone QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      EXPO_PUBLIC_ADS_MODE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Activate Yarn 1.22.22
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Quality gates
        run: |
          yarn lint
          yarn typecheck
          yarn test
          yarn expo-doctor

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release-mode QA APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and stage APK
        run: |
          APK_PATH="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "QA APK bulunamadi" >&2
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner bulunamadi" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/Zikirmatik-Global-v1.1.0-QA.apk
          sha256sum artifacts/Zikirmatik-Global-v1.1.0-QA.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload QA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zikirmatik-global-v1.1.0-qa-apk
          path: |
            frontend/artifacts/Zikirmatik-Global-v1.1.0-QA.apk
            frontend/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
